name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: bash -n deploy/*.sh
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test
      - name: UI source guardrails
        run: python manage.py test deliveries.test_ui_contracts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Responsive browser tests
        env:
          COURIER_UI_TESTING: '1'
          ROUTE_UI_TESTING: '1'
        run: npx playwright test tests/ui/responsive.spec.js tests/ui/dispatcher.spec.js tests/ui/courier.spec.js tests/ui/schedules.spec.js tests/ui/schedule-audit.spec.js
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: schedule-ux-screenshots
          path: |
            test-results/**/personal-calendar.png
            test-results/**/team-calendar.png
            test-results/**/schedule-overview.png
            test-results/**/personal-header-refined.png
            test-results/**/team-header-refined.png
            test-results/**/schedule-details-refined.png
            test-results/**/schedule-audit-refined.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

