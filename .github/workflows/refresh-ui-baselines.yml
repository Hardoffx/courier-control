name: Refresh UI visual baselines

on:
  push:
    branches:
      - fix/update-ui-baselines-2026-09-24

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[snapshots-updated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Regenerate approved visual baselines
        run: npx playwright test tests/ui/visual.spec.js --update-snapshots
      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/visual.spec.js-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git commit -m "test: refresh UI visual baselines [snapshots-updated]"
          git push origin HEAD:fix/update-ui-baselines-2026-09-24
