<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Courier Control{% endblock %}</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#17202a}.top{background:#111827;color:white;padding:14px 18px;display:flex;justify-content:space-between}.top a{color:white}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;background:#111827;color:white;text-decoration:none;font-weight:650;cursor:pointer}.btn.good{background:#15803d}.btn.bad{background:#b91c1c}.btn.alt{background:#e5e7eb;color:#111827}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{font-size:26px;font-weight:800}.muted{color:#6b7280}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 12px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #eee}@media(max-width:650px){.wrap{padding:10px}table{font-size:13px}.desktop{display:none}.btn{padding:13px 14px}}</style></head><body><div class="top"><b>Courier Control</b>{% if user.is_authenticated %}<span>{{ user.get_full_name|default:user.username }} · <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button style="background:none;border:0;color:white;text-decoration:underline">Выйти</button></form></span>{% endif %}</div><main class="wrap">{% block content %}{% endblock %}</main></body></html>
