<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Courier Control{% endblock %}</title><style>:root{--ink:#17202a;--muted:#667085;--line:#e4e7ec;--nav:#111827}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:var(--ink)}.top{background:var(--nav);color:white;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:white}.wrap{max-width:1440px;margin:auto;padding:18px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 15px;background:#111827;color:white;text-decoration:none;font-weight:650;cursor:pointer}.btn.good{background:#15803d}.btn.bad{background:#b91c1c}.btn.alt{background:#e5e7eb;color:#111827}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{font-size:26px;font-weight:800}.muted{color:var(--muted)}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 12px}table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{position:sticky;top:0;background:#f8fafc;color:#475467;font-size:12px;text-transform:uppercase;letter-spacing:.03em;z-index:1}.route-table tbody tr:hover td{filter:brightness(.98)}.route-table td:first-child{font-weight:750;text-align:center;width:54px}.route-table .object{font-weight:750;white-space:nowrap}.row-green td{background:#dff3df}.row-yellow td{background:#fff2b8}.row-red td{background:#f9d7d7}.row-blue td{background:#dceeff}.row-gray td{background:#eceff1}.type{display:inline-block;padding:3px 7px;border-radius:999px;background:#fff9;font-size:11px;font-weight:700}.status{white-space:nowrap;font-weight:650}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}@media(max-width:650px){.wrap{padding:10px}.desktop{display:none}.btn{padding:13px 14px}.top{font-size:14px}}</style></head><body><div class="top"><b>Courier Control</b>{% if user.is_authenticated %}<span>{{ user.get_full_name|default:user.username }} · <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button style="background:none;border:0;color:white;text-decoration:underline">Выйти</button></form></span>{% endif %}</div><main class="wrap">{% block content %}{% endblock %}</main></body></html>
