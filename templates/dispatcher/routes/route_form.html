{% extends 'base.html' %}{% block title %}Маршрут · Courier Control{% endblock %}{% block content %}<div class="card" style="max-width:760px;margin:auto"><h1>{% if route %}Настройки {{ route.name }}{% else %}Новый маршрут{% endif %}</h1><form method="post">{% csrf_token %}<label>Название<input name="name" value="{{ route.name|default:'' }}" placeholder="Например: Маршрут 1" required></label><label>Обычный курьер<select name="default_courier"><option value="">Не назначен</option>{% for c in couriers %}<option value="{{ c.pk }}" {% if route.default_courier_id == c.pk %}selected{% endif %}>{{ c.get_full_name|default:c.username }}</option>{% endfor %}</select></label><label>Заметка<textarea name="notes" rows="4">{{ route.notes|default:'' }}</textarea></label><button class="btn">Сохранить</button> <a class="btn alt" href="{% url 'route_list' %}">Назад</a></form></div>{% endblock %}
